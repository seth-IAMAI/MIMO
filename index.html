<style>

html{background:radial-gradient(60% 60% at 10% 0%,rgba(16,185,129,.18),transparent 60%),radial-gradient(60% 60% at 90% 10%,rgba(244,63,94,.12),transparent 60%),linear-gradient(180deg,rgb(var(--c-bg)) 0%,rgb(var(--c-bg)) 100%)}
html.dark{background:radial-gradient(60% 60% at 10% 0%,rgba(16,185,129,.18),transparent 60%),radial-gradient(60% 60% at 90% 10%,rgba(244,63,94,.10),transparent 60%),linear-gradient(180deg,rgb(var(--c-bg)) 0%,rgb(var(--c-bg)) 100%)}
body{color:rgb(var(--c-ink));min-height:100dvh;overflow-x:hidden}

.glass-strong{background:rgba(255,255,255,.85);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.55)}

.tabular{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

.tracking-slim{letter-spacing:-0.06em}
.cursive{font-style:italic;font-weight:700}
.fade-in{animation:fadeIn .35s ease both}

html.dark .lift:hover{box-shadow:0 14px 40px rgba(0,0,0,.5)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.625rem 1.1rem;border-radius:1rem;font-weight:600;font-size:.875rem;line-height:1;transition:transform .15s ease,background .15s ease,color .15s ease,box-shadow .15s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-emerald{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.35)}
.btn-emerald:hover{background:linear-gradient(135deg,#059669,#047857)}
.btn-rose{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;box-shadow:0 6px 18px rgba(244,63,94,.30)}
.btn-rose:hover{background:linear-gradient(135deg,#e11d48,#be123c)}
.btn-ghost{background:transparent;color:rgb(var(--c-ink))}
.btn-ghost:hover{background:rgba(148,163,184,.14)}
.btn-outline{border:1px solid rgba(148,163,184,.4);background:transparent;color:rgb(var(--c-ink))}
.btn-outline:hover{background:rgba(148,163,184,.12)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .55rem;border-radius:999px;font-size:.7rem;font-weight:600;letter-spacing:.02em}
.chip-emerald{background:rgba(16,185,129,.12);color:#047857}
html.dark .chip-emerald{background:rgba(16,185,129,.2);color:#6ee7b7}
.chip-rose{background:rgba(244,63,94,.12);color:#be123c}

.progress{height:.5rem;background:rgba(148,163,184,.2);border-radius:999px;overflow:hidden}
.progress-bar{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px}
.scrollbar-thin::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:999px}

.label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgb(var(--c-muted));margin-bottom:.3rem}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(148,163,184,.4),transparent)}
.gradient-emerald{background:linear-gradient(135deg,#10b981 0%,#059669 100%)}

.brand-glow{position:relative}

.fab{position:fixed;right:1rem;z-index:55;width:3.75rem;height:3.75rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 30px rgba(16,185,129,.45),0 0 0 4px rgba(16,185,129,.15);cursor:pointer;transition:transform .15s ease;-webkit-tap-highlight-color:transparent}
.fab:hover{transform:scale(1.06)}
.fab:active{transform:scale(.94)}
@media(min-width:768px){.fab{bottom:1.5rem}.fab-mobile{bottom:5rem}}
@media(max-width:767px){.fab{bottom:calc(5rem + env(safe-area-inset-bottom))}}
.tap-fb:active{transform:scale(.97);transition:transform .12s ease}
.kpi-num,.glass{transition:transform .18s ease,box-shadow .18s ease}
.glass:active{transform:scale(.995)}
.scrim-text{text-shadow:0 2px 12px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5)}
@media(max-width:767px){.modal-card{max-width:none;width:100%;max-height:96vh;height:96vh;border-radius:1.5rem 1.5rem 0 0;padding:1rem 1rem calc(1.25rem + env(safe-area-inset-bottom)) 1rem}}
@media(max-width:767px){.modal-card.has-handle::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:rgba(148,163,184,.45);margin:0 auto .75rem auto}}
.skeleton{background:linear-gradient(90deg,rgba(148,163,184,.15) 25%,rgba(148,163,184,.35) 50%,rgba(148,163,184,.15) 75%);background-size:200% 100%;animation:skel 1.4s ease-in-out infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
</style>

/* ========= STATE ========= */
let STATE={
  users:[],circles:[],expenses:[],trips:[],
  currentUserId:null,currentCircleId:null,
  settings:{theme:'light',currency:'PHP'},
  loaded:false
};
function loadState(){
  const stored=store.get('state',null);
  if(stored && stored.users && stored.circles){
    STATE=Object.assign(STATE,stored);
  } else {
    const seedData=seed();
    STATE.users=seedData.users;
    STATE.circles=seedData.circles;
    STATE.expenses=seedData.expenses;
    STATE.trips=seedData.trips;
    if(!STATE.currentUserId) STATE.currentUserId='u_alex';
    if(!STATE.currentCircleId) STATE.currentCircleId='c_family';
  }
  const sets=store.get('settings',null);
  if(sets) STATE.settings=Object.assign(STATE.settings,sets);
  STATE.loaded=true;
}
function saveState(){
  store.set('state',{
    users:STATE.users,circles:STATE.circles,expenses:STATE.expenses,trips:STATE.trips,
    currentUserId:STATE.currentUserId,currentCircleId:STATE.currentCircleId
  });
}
function saveSettings(){store.set('settings',STATE.settings)}

/* ========= SELECTORS ========= */
function currentUser(){return STATE.users.find(u=>u.id===STATE.currentUserId)}
function currentCircle(){return STATE.circles.find(c=>c.id===STATE.currentCircleId)}
function userById(id){return STATE.users.find(u=>u.id===id)}
function circleById(id){return STATE.circles.find(c=>c.id===id)}
function myRole(circleId,userId){
  const c=circleById(circleId);if(!c) return null;
  const m=c.members.find(x=>x.userId===userId);return m?m.role:null;
}
function memberRoleIn(circle,userId){const m=circle.members.find(x=>x.userId===userId);return m?m.role:null}
function circleMemberUsers(circleId){
  const c=circleById(circleId);if(!c) return [];
  return c.members.map(m=>Object.assign({},userById(m.userId),{role:m.role,joinedAt:m.joinedAt})).filter(Boolean);
}
function expensesForCurrentCircle(){
  return STATE.expenses.filter(e=>e.circleId===STATE.currentCircleId).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''));
}
function tripsForCurrentCircle(){
  return STATE.trips.filter(t=>t.circleId===STATE.currentCircleId);
}

function toast(msg,type='emerald',ms=2800){
  const root=document.getElementById('toast-root');
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.textContent=msg;
  root.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},ms);
}
const notifySuccess=(m)=>toast(m,'emerald');
const notifyError=(m)=>toast(m,'rose');
const notifyInfo=(m)=>toast(m,'slate');

/* ========= CSV EXPORT ========= */
function downloadBlob(filename,text,mime='text/csv'){
  const blob=new Blob(['\ufeff'+text],{type:mime+';charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}
function escCSV(v){const s=String(v==null?'':v);if(/[",\n]/.test(s))return '"'+s.replace(/"/g,'""')+'"';return s}
function exportExpensesCSV(){
  const rows=[['Date','Circle','Category','Amount','Payer','Note']];
  STATE.expenses.forEach(e=>{
    const payer=userById(e.payer);
    rows.push([dateStr(e.date),circleById(e.circleId)?.name||'',catMap[e.category]?.label||e.category,String(e.amount),payer?payer.name:'',e.note||'']);
  });
  downloadBlob('mimo-expenses.csv',rows.map(r=>r.map(escCSV).join(',')).join('\n'));
  notifySuccess('Expenses exported to CSV');
}
function exportTripsCSV(){
  const rows=[['Trip','Circle','Destination','Budget','Spent','Remaining','Status']];
  STATE.trips.forEach(t=>{
    const spent=tripSpent(t);
    rows.push([t.name,circleById(t.circleId)?.name||'',t.destination,String(t.budget),String(spent),String(t.budget-spent),t.status]);
  });
  downloadBlob('mimo-trips.csv',rows.map(r=>r.map(escCSV).join(',')).join('\n'));
  notifySuccess('Trips exported to CSV');
}
function tripSpent(t){
  if(!t||!t.expenses) return 0;
  return t.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
}
function tripCatBudget(t,key){const c=(t.categories||[]).find(x=>x.key===key);return c?Number(c.amount||0):0}
function tripCatSpent(t,key){return (t.expenses||[]).filter(e=>e.cat===key).reduce((s,e)=>s+Number(e.amount||0),0)}
function tripOverall(t){const b=(t.categories||[]).reduce((s,c)=>s+Number(c.amount||0),0);return {budget:b||t.budget||0,spent:tripSpent(t)}}
function tripMembersList(circleId){return STATE.expenses}

function statCounter(el,target,opts={}){
  if(!el) return;
  const dur=opts.dur||900;const start=performance.now();const from=opts.from||0;
  function frame(t){
    const p=Math.min(1,(t-start)/dur);
    const eased=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const val=from+(target-from)*eased;
    el.textContent=opts.dollars!=null?fmtMoney(val,opts.dollars):Math.round(val).toLocaleString();
    if(p<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  m.innerHTML=`
    <div class="modal-card">
      <div class="flex items-center justify-between mb-2"><h3 class="font-bold text-lg">${c.emoji} ${escapeHtml(c.name)}</h3><button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">${ico('x','w-5 h-5')}</button></div>
      <div class="glass rounded-2xl p-3 flex items-center gap-2 my-3">
        <span class="chip chip-slate shrink-0">${ico('key','w-3 h-3')} Invite code</span>
        <code class="font-bold tracking-widest flex-1 text-center">${c.invite}</code>
        <button class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500" onclick="copyInviteCode('${c.invite}')" title="Copy">${ico('copy','w-4 h-4')}</button>
      </div>
      <p class="label">Members (${members.length})</p>
      <div class="space-y-1.5 mb-4 max-h-64 overflow-auto scrollbar-thin">${members.map(x=>{
        const isSelf=x.id===STATE.currentUserId;
        const isCurrentOwner=x.role==='owner';
        return `<div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-500/5">
          <span class="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0" style="background:${avatarBg(x.id)}">${initials(x.name)}</span>
          <div class="flex-1 min-w-0"><p class="text-sm font-semibold truncate">${escapeHtml(x.name)} ${isSelf?'<span class="text-emerald-500 text-xs">(you)</span>':''}</p><p class="text-xs text-slate-400">${escapeHtml(x.handle)} · joined ${formatHumanDate(new Date(x.joinedAt))}</p></div>
          ${isCurrentOwner?'<span class="chip chip-amber">Owner</span>':`<select onchange="changeMemberRole('${cid}','${x.id}',this.value)" class="input !py-1 !px-2 text-xs !w-24">${Object.keys(ROLES).filter(r=>r!=='owner').map(r=>`<option ${x.role===r?'selected':''} value="${r}">${ROLES[r].label}</option>`).join('')}</select>`}
          ${!isCurrentOwner&&x.id!==STATE.currentUserId?`<button class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500" onclick="removeMember('${cid}','${x.id}')" title="Remove">${ico('x','w-4 h-4')}</button>`:''}
        </div>`;
      }).join('')}</div>
      ${nonMemberUserIds(c).length?`<p class="label">Add member (demo pick)</p><div class="flex flex-wrap gap-1.5">${nonMemberUserIds(c).map(id=>{const u=userById(id);if(!u)return'';return `<button class="chip chip-slate" onclick="addMember('${cid}','${id}')">+ ${escapeHtml(u.name)}</button>`}).join('')}</div>`:`<p class="text-xs text-slate-400">Everyone in the demo is a member.</p>`}
    </div>`;
  const mr=document.getElementById('modal-root');mr.innerHTML='';mr.appendChild(m);
  m.addEventListener('click',ev=>{if(ev.target===m)closeModal()});
}
function nonMemberUserIds(c){return STATE.users.filter(u=>!c.members.some(m=>m.userId===u.id)).map(u=>u.id)}
function addMember(cid,uid){
  const c=circleById(cid);if(!c)return;
  const role=myRole(cid,STATE.currentUserId);
  if(!can.manageMembers(role)){notifyError('Not allowed');return}
  if(c.members.some(m=>m.userId===uid)){notifyInfo('Already a member');return}
  c.members.push({userId:uid,role:'member',joinedAt:new Date().toISOString()});
  saveState();notifySuccess(`Added ${userById(uid).name}`);openManageCircle(cid);
}
function removeMember(cid,uid){
  const c=circleById(cid);if(!c)return;
  c.members=c.members.filter(m=>m.userId!==uid);
  const keep=c.members.some(m=>m.role==='owner')?c.members:c.members.map((m,i)=>i===0?Object.assign({},m,{role:'owner'}):m);
  if(c.members.length&&!c.members.some(m=>m.role==='owner')){keep[0].role='owner'}
  c.members=keep;
  saveState();notifySuccess('Member removed');openManageCircle(cid);
}
function changeMemberRole(cid,uid,newRole){
  const c=circleById(cid);if(!c)return;
  const m=c.members.find(x=>x.userId===uid);if(!m)return;
  m.role=newRole;saveState();
  notifySuccess(`Role updated to ${ROLES[newRole].label}`);
  openManageCircle(cid);
}
function copyInviteCode(code){
  try{navigator.clipboard.writeText(code).then(()=>notifySuccess('Invite code copied'))}catch(e){notifyInfo(code)}
}

/* ========= CONFIRM MODAL + DELETE CIRCLE ========= */
function openConfirmCircleDelete(cid){
  const c=circleById(cid);if(!c)return;
  openConfirm(`Delete "${c.name}"?`,'This removes the circle and all its expenses & trips. This cannot be undone.','Delete circle',()=>{
    STATE.circles=STATE.circles.filter(x=>x.id!==cid);
    STATE.expenses=STATE.expenses.filter(e=>e.circleId!==cid);
    STATE.trips=STATE.trips.filter(t=>t.circleId!==cid);
    if(STATE.currentCircleId===cid)STATE.currentCircleId=(STATE.circles[0]||{}).id||null;
    saveState();closeModal();notifySuccess('Circle deleted');route();
  },'rose');
}
function openConfirmReset(){
  openConfirm('Reset all MIMO data?','This erases users, circles, expenses & trips saved in this browser and restores the demo data.','Reset',()=>reseedDemo(),'rose');
}
function openConfirm(title,msg,btnLabel,action,btnType='emerald'){
  const m=document.createElement('div');m.className='modal-backdrop';
  m.innerHTML=`<div class="modal-card !max-w-sm">
    <div class="text-center py-2">
      <span class="inline-flex w-14 h-14 rounded-2xl ${btnType==='rose'?'bg-rose-500/10 text-rose-500':'bg-emerald-500/10 text-emerald-500'} items-center justify-center mb-3">${ico(btnType==='rose'?'alert':'refresh','w-7 h-7')}</span>
      <h3 class="font-bold text-lg mb-1">${escapeHtml(title)}</h3>
      <p class="text-sm text-slate-400 mb-5">${escapeHtml(msg)}</p>
      <div class="flex gap-2">
        <button class="btn btn-outline flex-1" onclick="closeModal()">Cancel</button>
        <button class="btn ${btnType==='rose'?'btn-rose':'btn-emerald'} flex-1" onclick="confirmAct()">${escapeHtml(btnLabel)}</button>
      </div>
    </div></div>`;
  window.__confirmAction=()=>{closeModal();action()};
  const mr=document.getElementById('modal-root');mr.innerHTML='';mr.appendChild(m);
  m.addEventListener('click',ev=>{if(ev.target===m)closeModal()});
  document.querySelector('[onclick="confirmAct()"]');
  const btn=m.querySelector('[onclick^="confirmAct"]');if(btn)btn.onclick=()=>{window.__confirmAction()};
}
function confirmAct(){window.__confirmAction&&window.__confirmAction()}
/* ========= SETTINGS ACTIONS ========= */
function setCurrency(c){
  STATE.settings.currency=c;saveSettings();
  notifySuccess('Currency set to '+c);renderSettings(document.getElementById('page'));
}
function setThemeFromUI(t){setThemeMode(t);renderLayout(currentRoute())}
function reseedDemo(){
  store.clear();
  const seedData=seed();
  STATE.users=seedData.users;STATE.circles=seedData.circles;STATE.expenses=seedData.expenses;STATE.trips=seedData.trips;
  STATE.currentUserId='u_alex';STATE.currentCircleId='c_family';
  STATE.settings={theme:document.documentElement.classList.contains('dark')?'dark':'light',currency:'PHP'};
  saveState();saveSettings();closeModal();
  notifySuccess('Data reset — demo restored');route();
}

/* ========= FAB (quick add) ========= */
function fab(){
  const role=myRole(STATE.currentCircleId,STATE.currentUserId);
  if(!can.log(role))return '';
  return `<button class="fab" onclick="openAddExpense()" title="Add expense">${ico('plus','w-6 h-6')}</button>`;
}

function init(){
  loadState();
  applySavedTheme();
  window.addEventListener('hashchange',route);
  window.addEventListener('beforeunload',saveState);
  route();
}
function applySavedTheme(){
  const t=STATE.settings.theme||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.classList.toggle('dark',t==='dark');
}
document.addEventListener('DOMContentLoaded',init);

window.openAddExpense=openAddExpense;window.closeModal=closeModal;window.openUserSwitcher=openUserSwitcher;window.switchUser=switchUser;
window.openCircleSwitcher=openCircleSwitcher;window.switchCircle=switchCircle;window.openAddTrip=openAddTrip;window.openTripDetail=openTripDetail;window.deleteTrip=deleteTrip;

/* ========= SWIPE GESTURE (mobile) ========= */
(function(){
  let sx=0,sy=0,st=0,active=false,dir='';
  const THRESH=70,MAX_T=600;
  function routeList(){
    return ['dashboard','expenses','trips','analytics','circles'];
  }
  function getRoute(){
    return (location.hash.replace('#/','')||'dashboard');
  }
  document.addEventListener('touchstart',e=>{
    if(document.querySelector('.modal-backdrop'))return;
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    sx=t.clientX;sy=t.clientY;st=Date.now();active=true;dir='';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!active)return;
    const t=e.touches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(!dir){
      if(Math.abs(dx)<15&&Math.abs(dy)<15)return;
      dir=Math.abs(dx)>Math.abs(dy)?'h':'v';
      if(dir==='v'){active=false;return;}
    }
    if(dir==='h'&&Math.abs(dx)>10){
      // gentle translate visual feedback on main
      const main=document.querySelector('main');
      if(main)main.style.transform='translateX('+(dx*0.18)+'px)';
    }
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!active)return;active=false;
    const main=document.querySelector('main');
    if(main)main.style.transform='';
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;
    if(dir!=='h')return;
    if(Math.abs(dx)<THRESH||dt>MAX_T)return;
    const routes=routeList();
    const i=routes.indexOf(getRoute());
    if(dx>0&&i>0){
      location.hash='#/'+routes[i-1];
    }else if(dx<0&&i>=0&&i<routes.length-1){
      location.hash='#/'+routes[i+1];
    }
  },{passive:true});
})();

</script>
